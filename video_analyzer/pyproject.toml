[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analyzer"
version = "0.1.0"
description = "Sample agent: analyze MP4 videos (speech + sampled frames) and produce a structured summary via OpenAI APIs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "curl-cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
hf = [
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
]

[project.scripts]
video-analyze = "video_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_analyzer*"]
